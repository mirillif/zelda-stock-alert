name: 🎮 Zelda — alerte stock

on:
  schedule:
    # Toutes les 5 minutes, décalé par rapport à l'heure pile.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Envoyer un e-mail de test (sans scan)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zelda-stock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vérifier les enseignes ou tester l'email
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          TEST_EMAIL: ${{ inputs.test_email || false }}
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            python watcher.py --test-email
          else
            python watcher.py
          fi
      - name: Mémoriser les alertes pour éviter les doublons
        if: ${{ inputs.test_email != true }}
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m 'chore: mise à jour des états de stock [skip ci]'
            git push
          fi
